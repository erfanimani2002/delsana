<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دلسانا شاپ | فروشگاه لوازم آرایشی</title>
<meta name="description" content="فروشگاه آنلاین لوازم آرایشی و بهداشتی دلسانا شاپ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/storefront.css">
</head>
<body>
<a href="#main-content" class="skip-link">رفتن به محتوای اصلی</a>

<!-- ============ Navbar ============ -->
<header class="navbar" role="banner">
  <div class="container">
    <a href="#main-content" class="navbar__logo">
      <img src="img/logo.jpg" alt="دلسانا شاپ" height="40">
    </a>

    <div class="navbar__search" role="search">
      <label for="search-input" class="visually-hidden">جستجوی محصول یا برند</label>
      <input type="search" id="search-input" class="input" placeholder="جستجوی محصول یا برند...">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </div>

    <div style="display:flex; gap:8px;">
      <button class="navbar__icon-btn navbar__mobile-search" id="mobile-search-toggle" aria-label="جستجو" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="navbar__icon-btn" id="menu-toggle" aria-label="منو" aria-expanded="false" aria-controls="mobile-menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="mobile-search-bar" id="mobile-search-bar" hidden>
  <label for="mobile-search-input" class="visually-hidden">جستجوی محصول یا برند</label>
  <input type="search" id="mobile-search-input" class="input" placeholder="جستجوی محصول یا برند...">
</div>

<nav id="mobile-menu" class="mobile-menu" aria-label="منوی اصلی">
  <!-- simple in-page anchor links; expand with JS class "open" if desired -->
</nav>

<main id="main-content">

  <!-- ============ Hero ============ -->
  <section class="hero">
    <div class="hero__content">
      <h1>دلسانا شاپ</h1>
      <p>لوازم آرایشی و بهداشتی اصل، با بهترین قیمت و ارسال سریع</p>
    </div>
    <div class="hero__image">
      <img src="img/hero.png" alt="لوازم آرایشی دلسانا شاپ">
    </div>
  </section>

  <!-- ============ Quick links ============ -->
  <section class="quick-links" aria-label="دسترسی سریع">
    <a class="quick-link" href="#footer" data-shop-address-link>
      <span class="circle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-7.4 8-13a8 8 0 1 0-16 0c0 5.6 8 13 8 13Z"/><circle cx="12" cy="9" r="3"/></svg>
      </span>
      موقعیت مکانی
    </a>
    <a class="quick-link" href="#" data-instagram-link target="_blank" rel="noopener">
      <span class="circle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
      </span>
      اینستاگرام
    </a>
  </section>

  <!-- ============ Categories ============ -->
  <section class="section section--sand">
    <div class="container">
      <div class="section__head"><h2>دسته‌بندی‌ها</h2></div>
      <div class="category-scroll" id="category-scroll" role="list"></div>
    </div>
  </section>

  <!-- ============ Products ============ -->
  <section class="section" id="products">
    <div class="container">
      <div class="section__head"><h2>محصولات</h2></div>

      <div class="filters-bar">
        <label for="sort-select" class="visually-hidden">مرتب‌سازی</label>
        <select id="sort-select" class="input" style="max-width:160px;">
          <option value="newest">جدیدترین</option>
          <option value="cheap">ارزان‌ترین</option>
          <option value="expensive">گران‌ترین</option>
        </select>
        <div class="chip-row" id="category-chips" role="list"></div>
      </div>

      <div class="product-grid" id="product-grid" role="list"></div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <div class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <p>محصولی یافت نشد. جستجوی دیگری را امتحان کنید.</p>
      </div>
      <div class="load-sentinel" id="load-sentinel"><div class="spinner" aria-label="در حال بارگذاری"></div></div>
    </div>
  </section>

  <!-- ============ How to order ============ -->
  <section class="section section--sand">
    <div class="container content-block">
      <h2 data-content-title="how_to_order">نحوه سفارش</h2>
      <p class="body-text" data-content-body="how_to_order"></p>
    </div>
  </section>

  <!-- ============ Packaging types ============ -->
  <section class="section">
    <div class="container content-block">
      <h2 data-content-title="packaging_types">انواع بسته‌بندی</h2>
      <p class="body-text" data-content-body="packaging_types"></p>
    </div>
  </section>

  <!-- ============ Sending types ============ -->
  <section class="section section--sand">
    <div class="container content-block">
      <h2 data-content-title="sending_types">روش‌های ارسال</h2>
      <p class="body-text" data-content-body="sending_types"></p>
    </div>
  </section>

</main>

<!-- ============ Footer ============ -->
<footer class="site-footer" id="footer" role="contentinfo">
  <div class="container">
    <div>
      <h4>آدرس فروشگاه</h4>
      <p data-footer-address></p>
    </div>
    <div>
      <h4 data-content-title="about_us">درباره ما</h4>
      <p data-content-body="about_us"></p>
    </div>
    <div>
      <h4>ارتباط با ما</h4>
      <p><a data-instagram-link href="#" target="_blank" rel="noopener">اینستاگرام</a></p>
    </div>
  </div>
  <p class="copyright" data-copyright>© دلسانا شاپ</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/storefront/ui.js"></script>
<script src="js/storefront/categories.js"></script>
<script src="js/storefront/products.js"></script>
<script src="js/storefront/product-modal.js"></script>
<script src="js/storefront/app.js"></script>
</body>
</html>
